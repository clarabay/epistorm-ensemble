name: Automated Flusight submission

# ─────────────────────────────────────────────────────────────
# Uses ONE classic PAT (secret: CLASSIC_PAT) for everything:
# pushing the fork branch AND opening the cross-repo PR.
# A classic PAT is the only token type that can span two owners
# (your org fork + the upstream) and open a fork->upstream PR.
#
# This same design works for the REAL CDC repo later, because a
# classic PAT is also the only token with write to a public repo
# you don't own. To go live: change UPSTREAM_REPO and fork the
# real hub; nothing else changes.
#
# WHERE THIS LIVES: it can live in the FORK or the SCRIPT repo —
# here it's set up to run from the SCRIPT repo (clarabay/epistorm-ensemble),
# so NOTHING is added to the fork at all except branches with the CSV.
#
# EDIT:
#   UPSTREAM_REPO = clarabay/forecast-hub-practice  (later: cdcepi/FluSight-forecast-hub)
#   FORK_REPO     = clara-epistorm-test/forecast-hub-practice
#   SCRIPT_REPO   = clarabay/epistorm-ensemble
# ─────────────────────────────────────────────────────────────
env:
  UPSTREAM_REPO: cdcepi/FluSight-forecast-hub
  FORK_REPO: clarabay/FluSight-forecast-hub
  SCRIPT_REPO: clarabay/epistorm-ensemble
  SCRIPT_PATH: epistorm-ensemble-submission_26-27.py
  MODEL_DIR: model-output/Epistorm-Ensemble_Flu
  DEFAULT_BRANCH: main

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: generate CSV only (no push or PR)"
        type: boolean
        default: true
        

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      # Script repo — checked out WITH the PAT so we can commit outputs back to it.
      - name: Checkout script repo
        uses: actions/checkout@v4
        with:
          path: script-src
          token: ${{ secrets.CLASSIC_PAT }}
          persist-credentials: true
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r script-src/requirements-submission.txt
 
      - name: Clone fork and fetch upstream
        env:
          CLASSIC_PAT: ${{ secrets.CLASSIC_PAT }}
        run: |
          git clone "https://x-access-token:${CLASSIC_PAT}@github.com/${FORK_REPO}.git" fork
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://x-access-token:${CLASSIC_PAT}@github.com/${UPSTREAM_REPO}.git"
          git fetch upstream
 
      - name: Generate submission
        id: change
        env:
          OUTPUT_DIR: ${{ github.workspace }}/fork/${{ env.MODEL_DIR }}
        run: |
          cd fork
          BRANCH="auto-submission-$(date +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}" "upstream/${DEFAULT_BRANCH}"
          mkdir -p "${OUTPUT_DIR}"
          cd ../script-src
          python "${SCRIPT_PATH}"
 
      # Commit the generated CSV + figure back into the SCRIPT repo's main.
      # Runs on every run (dry or real). Only commits if something changed.
      - name: Save outputs to script repo
        run: |
          cd script-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the script's local outputs (adjust paths if your script changes them)
          git add -A submissions_26-27/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No output changes to save to script repo."
          else
            git commit -m "Save ensemble outputs $(date -u +%Y-%m-%d)"
            git push origin HEAD:${DEFAULT_BRANCH}
          fi
 
      - name: Upload generated CSV (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: generated-submission
          path: ${{ github.workspace }}/fork/${{ env.MODEL_DIR }}/*.csv
          if-no-files-found: warn
 
      # ---- Everything below is SKIPPED on a dry run ----
 
      - name: Commit and push branch
        id: push
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd fork
          find "${MODEL_DIR}" -name '.DS_Store' -delete 2>/dev/null || true
          git add -- "${MODEL_DIR}"/*.csv
          if git diff --cached --quiet; then
            echo "No new CSV — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Automated submission $(date -u +%Y-%m-%d)"
          git push origin "${{ steps.change.outputs.branch }}"
 
      - name: Open pull request
        if: github.event.inputs.dry_run != 'true' && steps.push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLASSIC_PAT }}
        run: |
          cd fork
          FORK_OWNER="${FORK_REPO%%/*}"
          gh pr create \
            --repo "${UPSTREAM_REPO}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${FORK_OWNER}:${{ steps.change.outputs.branch }}" \
            --title "Epistorm ensemble submission $(date -u +%-m/%-d)"
 
