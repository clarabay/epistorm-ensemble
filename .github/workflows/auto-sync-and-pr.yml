name: Auto sync fork and open PR

# ─────────────────────────────────────────────────────────────
# EDIT THESE to match your setup:
#   UPSTREAM_REPO   = practice upstream now → the real FluSight hub later
#   FORK_REPO       = your fork (owner/name) — the org one
#   PR_TARGET_REPO  = where the PR opens (same as UPSTREAM_REPO)
#   SCRIPT_REPO     = the separate public repo holding your .py + ensemble.py + locations.csv
#   SCRIPT_PATH     = the script filename inside SCRIPT_REPO
#   MODEL_DIR       = folder inside the fork where the CSV goes
#   DEFAULT_BRANCH  = usually "main"
# ─────────────────────────────────────────────────────────────
env:
  UPSTREAM_REPO: clarabay/forecast-hub-practice          # EDIT
  FORK_REPO: clara-epistorm-test/forecast-hub-practice                       # EDIT
  PR_TARGET_REPO: clarabay/forecast-hub-practice         # EDIT
  SCRIPT_REPO: clarabay/epistorm-ensemble              # EDIT
  SCRIPT_PATH: epistorm-ensemble-submission_ex.py         # EDIT
  MODEL_DIR: model-output/Epistorm-Ensemble_Flu           # EDIT (FluSight path)
  DEFAULT_BRANCH: main

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the FORK (this is what gets synced + PR'd)
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0
          path: fork

      # 2. Check out the SCRIPT repo into a SEPARATE folder (never enters the fork)
      - name: Checkout script repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCRIPT_REPO }}
          path: script-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r script-src/requirements-submission.txt

      # 3. Sync the fork's main from upstream
      - name: Sync fork from upstream
        working-directory: fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream
          git checkout "${DEFAULT_BRANCH}"
          git merge "upstream/${DEFAULT_BRANCH}" --no-edit
          git push origin "${DEFAULT_BRANCH}"

      # 4. Run the script from script-src, writing the CSV INTO the fork's model dir.
      #    OUTPUT_DIR is read by your script (see the edit to line 301).
      - name: Generate submission CSV
        working-directory: script-src
        env:
          OUTPUT_DIR: ${{ github.workspace }}/fork/${{ env.MODEL_DIR }}
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python "${SCRIPT_PATH}"

      # 5. Commit ONLY the new CSV(s) in the model dir, on a new branch
      - name: Commit submission CSV
        id: change
        working-directory: fork
        run: |
          BRANCH="auto-submission-$(date +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}"
          git add "${MODEL_DIR}"/*.csv     # only CSVs in the model dir
          if git diff --cached --quiet; then
            echo "No new CSV to commit — nothing changed. Exiting cleanly."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Automated submission $(date -u +%Y-%m-%d)"
          git push origin "${BRANCH}"

      # 6. Open the PR fork → upstream (only if something was committed)
      - name: Open pull request
        if: steps.change.outputs.committed == 'true'
        working-directory: fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          FORK_OWNER="${FORK_REPO%%/*}"
          gh pr create \
            --repo "${PR_TARGET_REPO}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${FORK_OWNER}:${{ steps.change.outputs.branch }}" \
            --title "Epistorm-Ensemble_Flu submission $(date -u +%Y-%m-%d)" \
            --body "Automated ensemble submission generated by scheduled workflow."
