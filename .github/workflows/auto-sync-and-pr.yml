name: Auto sync fork and open PR

env:
  UPSTREAM_REPO: clarabay/forecast-hub-practice
  FORK_REPO: clara-epistorm-test/forecast-hub-practice
  PR_TARGET_REPO: clarabay/forecast-hub-practice   # PR into the UPSTREAM you own
  SCRIPT_PATH: epistorm-ensemble-submission_ex.py
  MODEL_DIR: model-output/Epistorm-Ensemble_Flu
  DEFAULT_BRANCH: main

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      # Script repo (this repo) — holds the .py, ensemble.py, locations.csv, requirements-ci.txt
      - name: Checkout script repo
        uses: actions/checkout@v4
        with:
          path: script-src

      # Fork — checked out by the action itself using the token (reliable auth).
      # persist-credentials keeps the token wired up for later push.
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          path: fork
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r script-src/requirements-submission.txt

      - name: Add upstream and fetch
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add upstream with a read token (works whether upstream is public or private).
          # Disable pushing to upstream entirely so nothing can accidentally target it.
          git remote add upstream "https://x-access-token:${SYNC_PAT}@github.com/${UPSTREAM_REPO}.git"
          git remote set-url --push upstream DISABLED_NO_PUSH
          git fetch upstream
          echo "----- remotes -----"
          git remote -v

      - name: Generate submission and push branch
        id: change
        env:
          OUTPUT_DIR: ${{ github.workspace }}/fork/${{ env.MODEL_DIR }}
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          cd fork
          BRANCH="auto-submission-$(date +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}" "upstream/${DEFAULT_BRANCH}"
          mkdir -p "${OUTPUT_DIR}"
          cd ../script-src
          python "${SCRIPT_PATH}"
          cd ../fork
          git add "${MODEL_DIR}"/*.csv
          if git diff --cached --quiet; then
            echo "No new CSV — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Automated submission $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${SYNC_PAT}@github.com/${FORK_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Diagnose fork relationship
        if: steps.change.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        run: |
          echo "===== Is the fork a real fork of upstream? ====="
          gh api "repos/${FORK_REPO}" --jq '{full_name, fork, parent: .parent.full_name, source: .source.full_name}' || true
          echo "===== Upstream repo default branch ====="
          gh api "repos/${PR_TARGET_REPO}" --jq '{full_name, default_branch}' || true

      - name: Open pull request
        if: steps.change.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        run: |
          FORK_OWNER="${FORK_REPO%%/*}"
          echo "Creating PR: head=${FORK_OWNER}:${{ steps.change.outputs.branch }} base=${DEFAULT_BRANCH} into ${PR_TARGET_REPO}"
          # Use the REST API directly so the real error message is visible
          gh api --method POST "repos/${PR_TARGET_REPO}/pulls" \
            -f title="Epistorm-Ensemble_Flu submission $(date -u +%Y-%m-%d)" \
            -f head="${FORK_OWNER}:${{ steps.change.outputs.branch }}" \
            -f base="${DEFAULT_BRANCH}" \
            -f body="Automated ensemble submission."
