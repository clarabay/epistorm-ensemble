name: Auto sync fork and open PR

# ─────────────────────────────────────────────────────────────
# Lives in the SCRIPT repo (clarabay/epistorm-ensemble).
# Operates on the FORK remotely; fork stays clean.
#
# YOUR LAYOUT:
#   UPSTREAM  = clarabay/forecast-hub-practice          (you do NOT have write — correct)
#   FORK      = clara-epistorm-test/forecast-hub-practice (token has write here)
#   PR: fork branch -> upstream main
# ─────────────────────────────────────────────────────────────
env:
  UPSTREAM_REPO: clarabay/forecast-hub-practice
  FORK_REPO: clara-epistorm-test/forecast-hub-practice
  PR_TARGET_REPO: clarabay/forecast-hub-practice
  SCRIPT_PATH: epistorm-ensemble-submission_ex.py       # EDIT if filename differs
  MODEL_DIR: model-output/Epistorm-Ensemble_Flu         # EDIT if path differs
  DEFAULT_BRANCH: main

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout script repo
        uses: actions/checkout@v4
        with:
          path: script-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r script-src/requirements-submission.txt

      # Clone the FORK using the token. origin = fork (we can push here).
      # upstream = the practice main (read-only for us).
      - name: Clone fork and add upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git" fork
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream

      # Branch FROM upstream/main so the PR diff is ONLY the CSV.
      # Generate the CSV, commit it, push the BRANCH to the fork (origin) only.
      - name: Generate submission and push branch
        id: change
        env:
          OUTPUT_DIR: ${{ github.workspace }}/fork/${{ env.MODEL_DIR }}
        run: |
          cd fork
          BRANCH="auto-submission-$(date +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}" "upstream/${DEFAULT_BRANCH}"
          mkdir -p "${OUTPUT_DIR}"
          cd ../script-src
          python "${SCRIPT_PATH}"
          cd ../fork
          git add "${MODEL_DIR}"/*.csv
          if git diff --cached --quiet; then
            echo "No new CSV — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Automated submission $(date -u +%Y-%m-%d)"
          git push origin "${BRANCH}"       # pushes to the FORK only

      - name: Open pull request
        if: steps.change.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          cd fork
          FORK_OWNER="${FORK_REPO%%/*}"
          gh pr create \
            --repo "${PR_TARGET_REPO}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${FORK_OWNER}:${{ steps.change.outputs.branch }}" \
            --title "Epistorm-Ensemble_Flu submission $(date -u +%Y-%m-%d)" \
            --body "Automated ensemble submission."
